<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1740" viewBox="0 0 1120 1740" role="img" aria-labelledby="cordis-title cordis-description">
  <title id="cordis-title">Electron Cordis 整体架构</title>
  <desc id="cordis-description">Profile 生成 GN 参数、Cargo feature 和冻结 LoadPlan。默认 Electron 桌面保留上游模块，Electron Lite 可选裁剪，Headless 跳过 Chromium。Supervisor 先启动并探测独立 Rust daemon，再拉起 Electron UI。Renderer 经沙箱化 Preload 与 Main 通信，Main 可显式经私有 Unix Socket 调用 Cordis。Cordis loader 按服务域装载插件，由 cordis-core 处理 Fiber 生命周期、依赖注入和回收。外部 Harness 通过显式端点连接，自行管理进程隔离。端砚 43.2.0 候选尚待同基线验收。</desc>
  <metadata>Color and layout reference: ../inkstone/docs/architecture/inkstone-architecture.svg. Runtime flows reflect the Electron Cordis working tree.</metadata>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#141413" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4E60FF" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7A756C" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
