    <text class="body" x="260" y="365.5">保留上游模块注册</text>
    <rect class="card" x="420" y="298" width="280" height="77" rx="6"/>
    <text class="node-title" x="560" y="319.5">Electron Lite</text>
    <text class="body" x="560" y="343.5">--electron-lite 显式启用</text>
    <text class="body" x="560" y="365.5">按配置裁剪源码与导出</text>
    <rect class="card" x="720" y="298" width="280" height="77" rx="6"/>
    <text class="node-title" x="860" y="319.5">Rust 运行时</text>
