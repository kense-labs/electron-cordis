    <text class="node-title" x="620" y="458.5">Chromium Content · Browser</text>
    <text class="body" x="620" y="481.5">WebContents / FrameTree · BrowserContext / StoragePartition · 子进程管理</text>
    <path class="data" d="M970 401V425" marker-end="url(#arrow-data)"/>
  </g>

  <g id="child-processes">
    <path class="control" d="M328 526V598" marker-end="url(#arrow-control)"/>
    <path class="control" d="M708 526V598" marker-end="url(#arrow-control)"/>
    <path class="control" d="M1000 526V598" marker-end="url(#arrow-control)"/>
    <text class="label" x="344" y="566">页面导航与进程分配</text>
    <text class="label" x="724" y="566">GPU 进程与通道</text>
    <text class="label" x="1016" y="566">服务按需启动</text>
  </g>

