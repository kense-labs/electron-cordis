    <text class="label-end" x="1150" y="63">当前源码 · 桌面默认路径</text>
    <text class="subtitle" x="90" y="104">Chromium 多进程 · Electron 原生绑定 · 嵌入式 Node.js</text>
    <rect class="panel" x="90" y="143" width="310" height="66" rx="6"/>
    <text class="node-title" x="245" y="170.5">系统启动可执行文件</text>
    <text class="body" x="245" y="193.5">Electron 入口 · shell/app</text>
    <rect class="panel" x="465" y="143" width="310" height="66" rx="6"/>
    <text class="node-title" x="620" y="170.5">Chromium ContentMain</text>
    <text class="body" x="620" y="193.5">读取进程类型 · 进入对应主函数</text>
    <rect class="panel" x="840" y="143" width="310" height="66" rx="6"/>
    <text class="node-title" x="995" y="170.5">ElectronMainDelegate</text>
    <text class="body" x="995" y="193.5">注册各进程的 ContentClient</text>
    <path class="control" d="M400 176H465" marker-end="url(#arrow-control)"/>
    <path class="control" d="M775 176H840" marker-end="url(#arrow-control)"/>
    <path class="control" d="M995 209V259" marker-end="url(#arrow-control)"/>
  </g>

