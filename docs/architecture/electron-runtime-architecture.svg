    <rect class="card" x="110" y="325" width="320" height="76" rx="6"/>
    <text class="node-title" x="270" y="357.5">Node.js · V8 · libuv</text>
    <text class="small-body" x="270" y="380.5">NodeBindings 接入 Chromium 消息循环</text>
    <rect class="card" x="460" y="325" width="320" height="76" rx="6"/>
    <text class="node-title" x="620" y="357.5">应用 Main 脚本</text>
    <text class="body" x="620" y="380.5">app · BrowserWindow · ipcMain</text>
    <rect class="card" x="810" y="325" width="320" height="76" rx="6"/>
    <text class="node-title" x="970" y="357.5">Electron Shell · C++</text>
    <text class="body" x="970" y="380.5">原生桌面 API · gin / V8 绑定</text>
