    <text class="small-body" x="1011" y="1132">ipcMain.handle()</text>
    <path class="data" d="M348 1114H371" marker-end="url(#arrow-data)"/>
    <path class="data" d="M609 1114H632" marker-end="url(#arrow-data)"/>
    <path class="data" d="M870 1114H892" marker-end="url(#arrow-data)"/>
