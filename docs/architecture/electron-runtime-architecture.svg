<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1640" viewBox="0 0 1240 1640" role="img" aria-labelledby="electron-title electron-description">
  <title id="electron-title">Electron 底层架构</title>
  <desc id="electron-description">Electron 通过 ContentMain 和 ElectronMainDelegate 接入 Chromium 多进程架构。Browser 主进程运行应用 Main 脚本，由 NodeBindings 将嵌入式 Node.js 的 libuv 事件循环接入 Chromium 消息循环。沙箱 Renderer 中的页面通过 contextBridge 调用隔离的 Preload API，经 Electron C++ 和 Mojo 进入 Main。Renderer 的合成帧交给 Viz，Network Service 和 Electron NodeService 由服务进程承载。Cordis Daemon 通过 Main 的可选客户端接入。</desc>
  <metadata>Electron Cordis checkout. Entry and process clients: shell/app. Browser bootstrap: shell/browser and shell/common/node_bindings.cc. Renderer and IPC: shell/renderer and shell/common/api/api.mojom. Chromium: src/content and src/components/viz. Palette and layout follow ../inkstone/docs/architecture/inkstone-architecture.svg.</metadata>
  <defs>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4E60FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Menlo, "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", monospace; font-weight: 400; fill: #141413; }
      .title { font-size: 36px; font-weight: 500; }
      .subtitle { font-size: 19px; }
      .section { font-size: 20px; fill: #FDFCF9; }
      .section-meta { font-size: 15px; fill: #FDFCF9; text-anchor: end; }
      .node-title { font-size: 18px; font-weight: 500; text-anchor: middle; }
      .small-title { font-size: 16px; font-weight: 500; text-anchor: middle; }
      .body { font-size: 15px; text-anchor: middle; }
      .small-body { font-size: 14px; text-anchor: middle; }
      .label { font-size: 14px; fill: #6C675F; }
      .label-end { font-size: 14px; fill: #6C675F; text-anchor: end; }
      .blue-text { fill: #3747CB; }
      .panel { fill: #FDFCF9; stroke: #141413; stroke-width: 1; }
      .blue-panel { fill: #FDFCF9; stroke: #4E60FF; stroke-width: 1.3; }
      .card { fill: #FDFCF9; stroke: #DCD6C8; stroke-width: 1; }
      .stripe { fill: #EDE9DF; }
      .ink-fill { fill: #141413; }
      .blue-fill { fill: #4E60FF; }
      .control { fill: none; stroke: #141413; stroke-width: 1.5; stroke-linejoin: round; }
      .data { fill: none; stroke: #4E60FF; stroke-width: 1.7; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1240" height="1640" rx="14" fill="#F8F6F0"/>
