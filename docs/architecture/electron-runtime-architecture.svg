    <rect class="card" x="630" y="1498" width="500" height="61" rx="6"/>
    <text class="small-title" x="880" y="1523">Electron Lite 显式启用</text>
    <text class="small-body" x="880" y="1546">Profile → GN 条件源码、C++ 绑定、JS 导出</text>
  </g>

  <g id="legend">
