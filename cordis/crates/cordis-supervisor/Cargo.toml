[package]
name = "electron-cordis-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Supervises the Cordis daemon and optional Chromium UI with a single-writer volume seal"

[lib]
name = "electron_cordis_supervisor"
path = "src/lib.rs"

[[bin]]
name = "electron-cordis-supervisor"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "process", "time"] }

[lints]
workspace = true
