[package]
name = "electron-cordis-krun-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "KRun heterogeneous execution backends and Plane A/B/C adapters as Cordis plugins"

[features]
default = ["os-sandbox", "fake", "wasm", "vm", "kiri-vz", "kiri-win"]
os-sandbox = ["dep:krun-backend-os-sandbox"]
fake = ["dep:krun-backend-fake"]
wasm = ["dep:krun-backend-wasm"]
vm = ["dep:krun-backend-vm"]
kiri-vz = ["dep:krun-backend-kiri-vz"]
kiri-win = ["dep:krun-backend-kiri-win"]

[dependencies]
cordis-core.workspace = true
electron-cordis-kernel = { path = "../cordis-kernel" }
krun-runtime.workspace = true
krun-backend-os-sandbox = { workspace = true, optional = true }
krun-backend-fake = { workspace = true, optional = true }
krun-backend-wasm = { workspace = true, optional = true }
krun-backend-vm = { workspace = true, optional = true }
krun-backend-kiri-win = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
krun-backend-kiri-vz = { workspace = true, optional = true }

[lints]
workspace = true
