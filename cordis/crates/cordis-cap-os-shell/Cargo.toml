[package]
name = "electron-cordis-cap-os-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Class-A Rust DSH capability plugin for OS shell operations and bounded host processes"

[dependencies]
cordis-core.workspace = true
electron-cordis-kernel = { path = "../cordis-kernel" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true
