[package]
name = "electron-cordis-cap-desktop-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "M3 Batch 2 Class-A Rust DSH plugins: @dsh/cap-tray-menu, @dsh/cap-notification, @dsh/cap-os-integration"

[features]
default = ["tray-menu", "notification", "os-integration"]
